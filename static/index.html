<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <header class="bar top" id="top">
      <h1>Calculator</h1>
      <button type="button" class="text-button" id="reset">Reset</button>
    </header>

    <main class="tape" id="tape">
      <div class="empty" id="empty">
        <p class="empty-title">Type a calculation</p>
        <p class="empty-body">Try <code>((3+5 = a) + 4 = b) + 8</code>, then <code>ans + b</code>.</p>
      </div>
      <ol class="entries" id="entries" aria-live="polite"></ol>
    </main>

    <form class="bar bottom" id="composer" autocomplete="off">
      <fieldset class="segmented" id="mode">
        <legend class="visually-hidden">Endpoint</legend>
        <label><input type="radio" name="mode" value="statement" checked><span>Statement</span></label>
        <label><input type="radio" name="mode" value="assignment"><span>Assign</span></label>
        <label><input type="radio" name="mode" value="expression"><span>Expr</span></label>
        <label><input type="radio" name="mode" value="term"><span>Term</span></label>
        <label><input type="radio" name="mode" value="factor"><span>Factor</span></label>
        <span class="thumb" aria-hidden="true"></span>
      </fieldset>
      <p class="mode-hint" id="mode-hint">Evaluates the line, saves variables and sets <code>ans</code>.</p>

      <div class="field" id="field">
        <label for="input" class="visually-hidden">Calculation</label>
        <input id="input" name="input" type="text" placeholder="sin(PI/2) + 1"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button type="submit" class="equals" aria-label="Evaluate">=</button>
      </div>
    </form>
  </div>
</body>
</html>
